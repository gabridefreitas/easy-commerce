spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easycommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:easycommerce}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:easycommerce}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:easycommerce_session}
app.auth.session-ttl=${APP_AUTH_SESSION_TTL:PT12H}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
