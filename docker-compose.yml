services:
  database:
    image: postgres:16-alpine
    container_name: easycommerce-db
    environment:
      POSTGRES_DB: easycommerce
      POSTGRES_USER: easycommerce
      POSTGRES_PASSWORD: easycommerce
    ports:
      - "5432:5432"
    volumes:
      - ./database/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/init/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
      - easycommerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easycommerce -d easycommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: maven:3.9.8-eclipse-temurin-17
    container_name: easycommerce-server
    working_dir: /workspace/server
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/easycommerce
      SPRING_DATASOURCE_USERNAME: easycommerce
      SPRING_DATASOURCE_PASSWORD: easycommerce
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./:/workspace
      - maven_repository:/root/.m2
    depends_on:
      database:
        condition: service_healthy

  app:
    image: node:20-alpine
    container_name: easycommerce-app
    working_dir: /workspace/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://server:8080
    volumes:
      - ./:/workspace
      - app_node_modules:/workspace/app/node_modules
    depends_on:
      - server

volumes:
  easycommerce_data:
  maven_repository:
  app_node_modules:
