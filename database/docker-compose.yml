version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: easycommerce-db
    environment:
      POSTGRES_DB: easycommerce
      POSTGRES_USER: easycommerce
      POSTGRES_PASSWORD: easycommerce
    ports:
      - "5432:5432"
    volumes:
      - ./init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./init/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - ./seeds:/docker-entrypoint-initdb.d/seeds
      - easycommerce_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "search_path=public"]

volumes:
  easycommerce_data:
